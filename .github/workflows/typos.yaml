---
name: typos
on: workflow_call
env:
  AQUA_LOG_COLOR: always
jobs:
  typos:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: typos
