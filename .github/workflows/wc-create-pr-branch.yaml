---
name: wc-create-pr-branch
run-name: wc-create-pr-branch (${{inputs.pr}})
on:
  workflow_call:
    inputs:
      version:
        type: string
        description: version
        required: true
      pr:
        description: "Pull Request Number"
        required: false
        type: string
      is_comment:
        description: If the comment is posted
        required: false
        default: false
        type: boolean
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true

jobs:
  create-pr-branch:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - if: inputs.pr != ''
        run: gh pr checkout "$PR"
        env:
          GITHUB_TOKEN: ${{github.token}}
          PR: ${{inputs.pr}}

      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
        env:
          GITHUB_TOKEN: ${{github.token}}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache-dependency-path: package-lock.json
          cache: npm
      - uses: flatt-security/setup-takumi-guard-npm@v1.4.0
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - run: npm ci

      - run: npm run lint
      - run: npm run build

      - uses: suzuki-shunsuke/release-js-action@v0.2.1
        with:
          version: ${{inputs.version}}
          is_comment: ${{inputs.is_comment}}
