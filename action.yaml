name: Update Branch securely
description: Update Branch securely
author: Shunsuke Suzuki
branding:
  icon: git-commit
  color: green
inputs:
  app_id:
    description: |
      GitHub App ID.
      Either app_id or client_id is required.
    required: false
  client_id:
    description: |
      GitHub App Client ID.
      Either app_id or client_id is required.
      GitHub recommends the Client ID, and it takes precedence when both are
      set.
    required: false
  app_private_key:
    description: |
      GitHub App Private Key.
      Either app_private_key or aws_kms_key_id is required.
    required: false
  aws_role_to_assume:
    description: |
      ARN of the AWS IAM role to assume with the GitHub OIDC token.
      The job needs the permission `id-token: write`.
      The credentials are kept inside this action and are never exported, so
      later steps of the job can't see them.
      Leave this unset to read credentials from AWS_ACCESS_KEY_ID,
      AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN instead, which is what
      aws-actions/configure-aws-credentials exports.
      Those environment variables are the only other source. A profile in
      ~/.aws/credentials, IMDS on a self-hosted EC2 runner and the credentials
      of an ECS or EKS task aren't read, so run
      aws-actions/configure-aws-credentials first to use any of them.
    required: false
  aws_kms_key_id:
    description: |
      Key ID, key ARN, alias name, or alias ARN of an AWS KMS key holding the
      GitHub App private key.
      Set this instead of app_private_key when the private key is stored in AWS
      KMS and can never be exported.
      The credentials come from AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and
      AWS_SESSION_TOKEN, unless aws_role_to_assume is set.
    required: false
  aws_region:
    description: |
      The AWS region of the KMS key, which is also the region of the STS
      endpoint when aws_role_to_assume is set.
      It can be omitted when aws_kms_key_id is an ARN, which carries the region.
      Otherwise it falls back to AWS_REGION or AWS_DEFAULT_REGION, and the
      action fails when none of them says which region the key is in.
    required: false

  # For Client
  server_repository_name:
    description: |
      Server repository name
    required: false
  server_repository_owner:
    description: |
      Server repository owner
    required: false
    default: ${{github.repository_owner}}
  repository_owner:
    description: The repository owner of the updated pull request
    required: false
    default: ${{github.repository_owner}}
  repository_name:
    description: The repository name of the updated pull request
    required: false
    default: ${{github.event.repository.name}}
  pull_request_number:
    description: |
      Pull request numbers of the updated pull requests.
      You can specify multiple pull request numbers separated by commas or newlines.
    required: false
    default: ${{github.event.issue.number}}

  label_name:
    description: |
      Label name to trigger the action.
    required: false
    default: ${{github.event.label.name}}
  label_description:
    description: |
      Label description to trigger the action.
    required: false
    default: ${{github.event.label.description}}
  delete_label:
    description: |
      Either true or false. If true, the label is deleted.
    required: false
    default: "true"
  github_token_to_delete_label:
    description: |
      GitHub token to delete the label.
    required: false
    default: "${{github.token}}"

runs:
  using: node24
  main: dist/index.js
